services:
  command-center:
    build: .
    command: pnpm --filter @wireassist/command-center start
    restart: unless-stopped
    ports:
      # Bound to loopback only — Caddy (or whatever's fronting this on the
      # VPS) is the only thing meant to be internet-facing. Change to
      # '3001:3001' if you need to reach the web UI directly without a
      # reverse proxy in front (e.g. no domain yet) — see docs/DEPLOYMENT.md.
      #
      # 3002 (the Hono API) is not published at all — the web UI on 3001
      # proxies /api/* to it internally (next.config.ts), and the
      # telegram-bot service reaches it over the compose network.
      - '100.71.202.102:3001:3001'
      # Loopback-only fallback, independent of Tailscale: if the tailnet is
      # down or misbehaving, `ssh -L 3001:127.0.0.1:3001 <host>` still reaches
      # the dashboard through SSH alone. Never reachable except via SSH
      # tunnel or a process on the VPS itself — not a public exposure.
      - '127.0.0.1:3001:3001'
    env_file:
      - .env
    environment:
      WIREASSIST_HOME: /data
      # Listen on all interfaces *inside the container* so the published port
      # and the telegram-bot service can reach it. Outside Docker the servers
      # default to loopback; exposure is controlled by the `ports:` above.
      API_HOST: 0.0.0.0
      WEB_HOST: 0.0.0.0
    volumes:
      - wireassist-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  telegram-bot:
    build: .
    command: node packages/telegram-bot/dist/index.js
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WIREASSIST_HOME: /data
      WIREASSIST_API_URL: http://command-center:3002
    volumes:
      - wireassist-data:/data
    depends_on:
      command-center:
        condition: service_healthy

  # Google sign-in for public access (docs/DEPLOYMENT.md section 6c). Opt-in:
  # only starts with `docker compose --profile public up -d oauth2-proxy`, so
  # a Tailscale-only deploy is unaffected. Caddy on the host calls it on
  # loopback to authenticate each request before proxying to the web UI.
  oauth2-proxy:
    profiles: ['public']
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:4180:4180'
    environment:
      OAUTH2_PROXY_PROVIDER: google
      # Set these three in .env (not committed). Empty defaults here keep the
      # compose file valid for stacks that never use the `public` profile.
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_REDIRECT_URL: https://wireassist.techtrendwire.com/oauth2/callback
      # Who may sign in: exactly the addresses in this file. Do NOT also set
      # OAUTH2_PROXY_EMAIL_DOMAINS — a domain match is accepted in addition
      # to the file, and "*" would admit any Google account.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/emails.txt
      # Auth-only mode: Caddy does the proxying, oauth2-proxy just answers
      # "is this request signed in?" on /oauth2/auth.
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: 'true'
      OAUTH2_PROXY_SET_XAUTHREQUEST: 'true'
      OAUTH2_PROXY_COOKIE_SECURE: 'true'
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: 'true'
      OAUTH2_PROXY_SILENCE_PING_LOGGING: 'true'
    volumes:
      - ./oauth2-allowed-emails.txt:/etc/oauth2-proxy/emails.txt:ro

volumes:
  wireassist-data:
